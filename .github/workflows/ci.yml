name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: agentscope
          POSTGRES_PASSWORD: agentscope
          POSTGRES_DB: agentscope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentscope" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://agentscope:agentscope@localhost:5432/agentscope_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Phase 1 "done when": compose starts everything, a key works, a bad key gets 401.
  compose:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: ci-admin-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS http://localhost:5180/api/health | grep -q '"status":"healthy"'
          KEY=$(curl -fsS -X POST localhost:8000/projects \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"ci"}' | jq -r .api_key.key)
          curl -fsS localhost:8000/v1/project -H "Authorization: Bearer $KEY"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/project \
            -H 'Authorization: Bearer bad')
          test "$CODE" = 401
          docker compose ps worker --status running | grep -q worker
      - if: failure()
        run: docker compose logs
