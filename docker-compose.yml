services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentscope}
      POSTGRES_DB: ${POSTGRES_DB:-agentscope}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the hosts are "db" and "redis", not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentscope}:${POSTGRES_PASSWORD:-agentscope}@db:5432/${POSTGRES_DB:-agentscope}
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    command: ["uv", "run", "--no-sync", "arq", "app.workers.main.WorkerSettings"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentscope}:${POSTGRES_PASSWORD:-agentscope}@db:5432/${POSTGRES_DB:-agentscope}
      REDIS_URL: redis://redis:6379/0
    healthcheck: { disable: true }
    depends_on:
      backend: { condition: service_healthy } # backend runs the migrations

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports: ["5180:5180"]
    depends_on: [backend]

volumes:
  pgdata:
